version: 2

updates:
  # The frontend.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5

  # The backend. Previously nothing watched the Rust crate, and nothing watched the old
  # `api/` directory either — which is why it was still on Express 4.
  - package-ecosystem: 'cargo'
    directory: '/api-rs'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5

  # The base images in the Dockerfile.
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'

  # The actions in .github/workflows.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
