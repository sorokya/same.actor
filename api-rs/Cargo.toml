[package]
name = "same-actor"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Same.Actor — does that title/actor share a cast?"
license = "MIT"

[dependencies]
# Templates are compiled into the binary: a typo is a build error, not a 500 at runtime.
askama = "0.16"
axum = "0.8"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "net",
  "time",
  "sync",
] }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
  "gzip",
  "http2",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.7", features = [
  "trace",
  "compression-gzip",
  "compression-br",
  "catch-panic",
  "fs",
  "set-header",
] }
moka = { version = "0.12", features = ["future"] }
# `bundled` compiles SQLite into the binary: no system library in the image, and the version
# is pinned by Cargo.lock instead of by whatever the base image ships.
rusqlite = { version = "0.43", features = ["bundled"] }
# Reads the DB-IP Lite database. DB-IP publishes MaxMind-DB format, so this is the reader.
maxminddb = "0.33"
flate2 = "1"
getrandom = "0.4"
# CIDR parsing and containment for bans. Hand-rolling v4/v6 mask arithmetic is how you end up
# with a /64 ban that silently matches nothing.
ipnet = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
resvg = "0.50"
tiny-skia = "0.12"
fontdb = "0.24"
base64 = "0.22"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Deliberately NOT `panic = "abort"`: panics must unwind so CatchPanicLayer can turn a bug in
# one handler into a 500 instead of a restarted process.
strip = true
